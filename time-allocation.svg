<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="700" height="400" fill="#0d1117"/>

  <text x="350" y="40" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">
    How I Allocate Time in Data Science Projects
  </text>

  <!-- Donut chart, radius 110, center (220,220), stroke-width 55 -->
  <!-- circumference = 2*pi*110 = 691.15 -->
  <g transform="rotate(-90 220 220)">

    <!-- Background track -->
    <circle cx="220" cy="220" r="110" fill="none" stroke="#1c2333" stroke-width="55"/>

    <!-- Data Wrangling & Cleaning: 40% = 276.46 -->
    <circle cx="220" cy="220" r="110" fill="none" stroke="#FF6B6B" stroke-width="55"
      stroke-dasharray="691.15" stroke-dashoffset="691.15" stroke-linecap="butt">
      <animate attributeName="stroke-dashoffset" from="691.15" to="414.69" dur="1.4s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
    </circle>

    <!-- EDA: 25% = 172.79, starts after 40% -->
    <circle cx="220" cy="220" r="110" fill="none" stroke="#4ECDC4" stroke-width="55"
      stroke-dasharray="691.15" stroke-dashoffset="691.15" stroke-linecap="butt"
      transform="rotate(144 220 220)">
      <animate attributeName="stroke-dashoffset" from="691.15" to="518.36" dur="1.2s" begin="1.6s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
    </circle>

    <!-- ML & Modeling: 20% = 138.23, starts after 65% -->
    <circle cx="220" cy="220" r="110" fill="none" stroke="#FFE66D" stroke-width="55"
      stroke-dasharray="691.15" stroke-dashoffset="691.15" stroke-linecap="butt"
      transform="rotate(234 220 220)">
      <animate attributeName="stroke-dashoffset" from="691.15" to="552.92" dur="1.0s" begin="2.8s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
    </circle>

    <!-- Visualization & Reporting: 15% = 103.67, starts after 85% -->
    <circle cx="220" cy="220" r="110" fill="none" stroke="#A78BFA" stroke-width="55"
      stroke-dasharray="691.15" stroke-dashoffset="691.15" stroke-linecap="butt"
      transform="rotate(306 220 220)">
      <animate attributeName="stroke-dashoffset" from="691.15" to="587.48" dur="0.9s" begin="3.8s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
    </circle>
  </g>

  <!-- Center percentage counters -->
  <text x="220" y="215" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">
    100%
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="4.6s" fill="freeze"/>
  </text>
  <text x="220" y="238" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8b949e" opacity="0">
    of project time
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="4.6s" fill="freeze"/>
  </text>

  <!-- Legend with animated fade-in + growing bars -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="15">

    <!-- item 1 -->
    <rect x="420" y="90" width="16" height="16" rx="3" fill="#FF6B6B" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.2s" fill="freeze"/>
    </rect>
    <text x="446" y="103" fill="#e6edf3" opacity="0">
      Data Wrangling &amp; Cleaning
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.3s" fill="freeze"/>
    </text>
    <rect x="446" y="110" width="0" height="6" rx="3" fill="#FF6B6B" opacity="0.85">
      <animate attributeName="width" from="0" to="160" dur="1.4s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
    </rect>
    <text x="612" y="116" fill="#8b949e" font-size="12" opacity="0">40%
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.5s" fill="freeze"/>
    </text>

    <!-- item 2 -->
    <rect x="420" y="150" width="16" height="16" rx="3" fill="#4ECDC4" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.6s" fill="freeze"/>
    </rect>
    <text x="446" y="163" fill="#e6edf3" opacity="0">
      Exploratory Data Analysis (EDA)
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.7s" fill="freeze"/>
    </text>
    <rect x="446" y="170" width="0" height="6" rx="3" fill="#4ECDC4" opacity="0.85">
      <animate attributeName="width" from="0" to="100" dur="1.2s" begin="1.6s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
    </rect>
    <text x="552" y="176" fill="#8b949e" font-size="12" opacity="0">25%
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="2.7s" fill="freeze"/>
    </text>

    <!-- item 3 -->
    <rect x="420" y="210" width="16" height="16" rx="3" fill="#FFE66D" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.8s" fill="freeze"/>
    </rect>
    <text x="446" y="223" fill="#e6edf3" opacity="0">
      Machine Learning &amp; Modeling
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.9s" fill="freeze"/>
    </text>
    <rect x="446" y="230" width="0" height="6" rx="3" fill="#FFE66D" opacity="0.85">
      <animate attributeName="width" from="0" to="80" dur="1.0s" begin="2.8s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
    </rect>
    <text x="532" y="236" fill="#8b949e" font-size="12" opacity="0">20%
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="3.7s" fill="freeze"/>
    </text>

    <!-- item 4 -->
    <rect x="420" y="270" width="16" height="16" rx="3" fill="#A78BFA" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="3.8s" fill="freeze"/>
    </rect>
    <text x="446" y="283" fill="#e6edf3" opacity="0">
      Visualization &amp; Reporting
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="3.9s" fill="freeze"/>
    </text>
    <rect x="446" y="290" width="0" height="6" rx="3" fill="#A78BFA" opacity="0.85">
      <animate attributeName="width" from="0" to="60" dur="0.9s" begin="3.8s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
    </rect>
    <text x="512" y="296" fill="#8b949e" font-size="12" opacity="0">15%
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="4.5s" fill="freeze"/>
    </text>
  </g>

  <text x="350" y="380" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#57606a">
    animated on load · loops via GitHub's native SVG/SMIL support
  </text>
</svg>
