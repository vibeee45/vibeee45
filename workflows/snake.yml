name: generate animated snake

on:
  schedule:
    - cron: "0 */12 * * *"   # har 12 ghante me chalega
  workflow_dispatch: {}       # Actions tab se manually bhi run kar sakte ho
  push:
    branches:
      - main                 # main branch pe push hote hi test ke liye chalega

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: generate snake svg
        uses: Platane/snk@v3
        with:
          github_user_name: vibeee45
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: push output to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
